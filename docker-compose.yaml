services:
  swarmauri-com:
    build: .
    container_name: swarmauri-com
    restart: unless-stopped
    labels:
      site.host: swarmauri.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      dockerwp:
        aliases:
          - swarmauri-com

networks:
  dockerwp:
    name: dockerwp
    external: true
