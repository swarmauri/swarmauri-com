services:
  swarmauri-com:
    build: .
    container_name: swarmauri-com
    restart: unless-stopped
    labels:
      site.host: swarmauri.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      swarmauri-com-private: {}
      portwyrm-edge:
        aliases:
          - swarmauri-com

networks:
  swarmauri-com-private:
    name: swarmauri-com-private
    internal: true
  portwyrm-edge:
    name: portwyrm-edge
    external: true
